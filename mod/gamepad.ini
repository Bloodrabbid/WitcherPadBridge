; WitcherPadBridge -- gamepad settings.
; Edited live: the bridge re-reads this file whenever it changes, no restart needed.

Enabled          = 1

; Stick deadzones, 0..1. Raise if the camera drifts on its own.
DeadzoneLeft     = 0.20
DeadzoneRight    = 0.16

; Camera speed in pixels per second at full stick deflection.
SensitivityX     = 1400
SensitivityY     = 900

; Response curve: 1.0 is linear, higher gives finer control near the centre.
CameraCurve      = 1.7
InvertY          = 0

; Cursor speed in menus, pixels per second.
MenuSensitivity  = 700

; --- автонаведение в бою -------------------------------------------------
; Удар в этой игре достаётся тому, кто под прицелом, а прицел — центр экрана,
; поэтому «навести» = довернуть камеру. Мост делает это только когда его просят
; и когда правый стик не трогают — игрок всегда главнее.
;   0 — выключено
;   1 — при атаке: пока зажата кнопка удара (по умолчанию)
;   2 — по кнопке: камера доворачивается ТОЛЬКО пока держишь кнопку из AimButton
AimAssist  = 1
; кнопка для режима 2: r3 l3 lb rb lt rt. Своё обычное действие она в этом режиме
; не выполняет (r3 по умолчанию — это переворот камеры, им жертвуем).
AimButton  = r3
; насколько быстро он доворачивает, px/с. Меньше — спокойнее, но можно не успеть
; к удару; больше — резче.
AimSpeed   = 2200

; --- активная пауза ------------------------------------------------------
; Пробел ставит игру на паузу, не закрывая экран, — в бою это половина тактики.
; На паде она висит на средней кнопке. Выбранная кнопка теряет своё обычное
; действие (Menu — это Esc, но Esc всё равно есть на B; lt/rt — стили ударов;
; l3/r3 — групповой стиль и переворот камеры).
;   touchpad — клик по тачпаду DualSense/DualShock (по умолчанию).
;              На Xbox-паде тачпада нет, поэтому там само переключается на menu.
;   menu back l3 r3 lt rt — если хочется другую кнопку.
;   none — не вешать никуда.
PauseButton = touchpad

; --- скорость ходьбы -----------------------------------------------------
; У игры нет клавиши «идти шагом» — startup.lua включает вечный бег, и Геральт
; носится даже по комнате. Мод возвращает вторую скорость: слабое отклонение
; стика — шаг, сильное — бег. Замерено вживую: бег ~8 ед/с, шаг ~2.2 ед/с.
; Значение — доля отклонения стика (по сырому стику, не по мёртвой зоне):
; 0.70 значит «семь десятых хода». 0 — выключить, всегда бег как раньше.
RunThreshold   = 0.70

; --- вибрация ------------------------------------------------------------
; Своей вибрации у игры нет — она 2007 года и про геймпады не знала. Мод берёт
; события движка (тряска камеры, попадания, ритм серии ударов, медальон) и сам
; крутит моторы: Core Haptics на macOS, XInput на Windows/Proton.
;   1 — включена, 0 — выключена
Rumble         = 1
; Общая сила в процентах: 0 — тишина, 100 — как задумано, 150 — сильнее.
RumbleStrength = 100

; --- диагностика ---------------------------------------------------------
; 0 — молчать, 1 — обычный лог, 2 — подробный (каждое нажатие и клик).
; Логи: <игра>/System/wxp_bridge.log (Windows) или /tmp/wxp_bridge.log (macOS),
;       <игра>/System/wxp_gamepad.log (Lua-слой).
; Собрать всё для отчёта об ошибке: tools/diagnose.sh (или tools\diagnose.bat).
LogLevel   = 1
